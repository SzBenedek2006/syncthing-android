name: Release App

on:
  push:
    # Cannot filter on both branches (release) and tags - it's ORed
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

env:
  # Our build metadata
  BUILD_USER: android-builder
  BUILD_HOST: github.syncthing.net

jobs:
  release:
    name: Release Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      # - name: Ensure release branch
        # run: |
          # git config --system --add safe.directory '*'
          # if ! git branch -a --contains $(git rev-parse HEAD) | grep release >/dev/null; then
            # echo "Tag is not part of release branch - aborting..."
            # exit 1
          # fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle


      - name: Build release artifacts
        env:
          SYNCTHING_RELEASE_KEY_ALIAS: Syncthing
          SIGNING_PASSWORD: '${{ secrets.SIGNING_PASSWORD }}'
          SYNCTHING_RELEASE_STORE_FILE: '${{ runner.temp }}/signing-keystore.jks'
          #SYNCTHING_RELEASE_PLAY_ACCOUNT_CONFIG_FILE: '${{ runner.temp }}/google-play-secrets.json'
        shell: bash
        run: |
          set -eu -o pipefail
          echo '${{ secrets.SIGNING_KEYSTORE_JKS_BASE64 }}' | base64 -d > "$SYNCTHING_RELEASE_STORE_FILE"
          #echo '${{ secrets.GOOGLE_PLAY_SECRETS_BASE64 }}' | base64 -d > "$SYNCTHING_RELEASE_PLAY_ACCOUNT_CONFIG_FILE"
          java -version
          # TODO: Readd publishReleaseBundle if google play works again, or
          # remove everything related to publishing to google play.
          ./gradlew --no-daemon buildNative assembleRelease bundleRelease
          rm "$SYNCTHING_RELEASE_STORE_FILE" # "$SYNCTHING_RELEASE_PLAY_ACCOUNT_CONFIG_FILE"

          # echo '${{ secrets.GNUPG_SIGNING_KEY_BASE64 }}' | base64 -d | gpg --import
          # cd app/build/outputs/apk/release
          # sha256sum app-release.apk | gpg --clearsign > sha256sum.txt.asc

      - name: Edit changelog
        shell: sh
        run: |
          GRADLE="app/build.gradle.kts"
          TOML="gradle/libs.versions.toml"

          VER_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' "$GRADLE")
          VER_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' "$GRADLE")
          APP_ID=$(sed -n 's/.*applicationId = "\(.*\)".*/\1/p' "$GRADLE" | head -n 1)

          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)".*/\1/p' "$TOML")
          TARGET_SDK=$(sed -n 's/^targetSdk = "\(.*\)".*/\1/p' "$TOML")
          COMPILE_SDK=$(sed -n 's/^compileSdk = "\(.*\)".*/\1/p' "$TOML")

          sdk_to_android() {
            awk -v v="$1" 'BEGIN {
              num = v + 0
              if (num == 23) print "Android 6"
              else if (num == 24) print "Android 7.0"
              else if (num == 25) print "Android 7.1"
              else if (num == 26) print "Android 8.0"
              else if (num == 27) print "Android 8.1"
              else if (num == 28) print "Android 9"
              else if (num == 29) print "Android 10"
              else if (num == 30) print "Android 11"
              else if (num == 31) print "Android 12"
              else if (num == 32) print "Android 12L"
              else printf "Android %.1f\n", (num - 20)
            }'
          }

          MIN_LABEL=$(sdk_to_android "$MIN_SDK")
          TARGET_LABEL=$(sdk_to_android "$TARGET_SDK")
          COMPILE_LABEL=$(sdk_to_android "$COMPILE_SDK")

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)

          sed \
            -e "s/- Version code:.*/- Version code: $VER_CODE/" \
            -e "s/- Version name:.*/- Version name: $VER_NAME/" \
            -e "s/- Application Id:.*/- Application Id: $APP_ID/" \
            -e "s/- Min:.*/- Min: $MIN_SDK ($MIN_LABEL)/" \
            -e "s/- Target:.*/- Target: $TARGET_SDK ($TARGET_LABEL)/" \
            -e "s/- Compile:.*/- Compile: $COMPILE_SDK ($COMPILE_LABEL)/" \
            -e "s|/compare/.*|/compare/${PREV_TAG}...${GITHUB_REF_NAME}|" \
            RELEASE_TEMPLATE.md > RELEASE_TEMPLATE.md.tmp && mv RELEASE_TEMPLATE.md.tmp RELEASE_TEMPLATE.md


      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/release/*.apk,app/build/outputs/bundle/release/*.aab" #,app/build/outputs/apk/release/*.asc"
          artifactErrorsFailBuild: true
          bodyFile: "RELEASE_TEMPLATE.md" #"app/src/main/play/release-notes/en-GB/default.txt"
          prerelease: ${{ contains('-rc.', github.ref_name) }}
          draft: true
